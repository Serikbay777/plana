# Plana — reverse proxy (HTTP only, без домена).

server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    # Engine API
    location /api/ {
        proxy_pass http://engine:8001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 3600s = 1 час. Альбом из 14 листов через gpt-image-1 может
        # занять 15-20+ минут, особенно при rate-limit OpenAI. Если и
        # этого мало — нужен SSE / streaming response вместо одного
        # большого запроса.
        proxy_connect_timeout 3600s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        send_timeout 3600s;
        # Буферизация ответа отключена — иначе nginx ждёт всё тело перед
        # передачей, а это 30-60MB JSON. Стримим как только engine отдаёт.
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Next.js
    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
