services:
  engine:
    build:
      context: ./engine
    container_name: plana-engine
    restart: unless-stopped
    env_file: .env
    volumes:
      - plana-data:/data
    environment:
      DB_PATH: /data/plana.db
    networks:
      - internal
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: plana-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      ENGINE_URL: http://engine:8001
    networks:
      - internal
    depends_on:
      engine:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    container_name: plana-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - internal
    depends_on:
      - web
      - engine

volumes:
  plana-data:

networks:
  internal:
    driver: bridge
